name: Seed — Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SEED to confirm running seeds on production'
        required: true

jobs:
  seed:
    name: Run seeds on production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'SEED'
    environment:
      name: production
      url: https://isengesho.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Build backend
        working-directory: apps/backend
        # `nest build` (npm run build) uses tsconfig.build.json, which deliberately
        # excludes src/database/seeds/** from the deployed app bundle. That means
        # dist/database/seeds never exists after a normal build — this workflow's
        # own rsync step below would silently fail to find anything to copy. The
        # second compile (tsconfig.seeds.json, no seeds exclude) fills in just
        # that directory without touching the rest of dist.
        run: |
          npm ci
          npm run build
          npx tsc -p tsconfig.seeds.json

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync compiled seeds to EC2
        run: |
          rsync -az \
            apps/backend/dist/database/seeds/ \
            ubuntu@${{ secrets.PRODUCTION_HOST }}:/opt/rmc-platform/apps/backend/dist/database/seeds/
          rsync -az \
            apps/backend/dist/config/ \
            ubuntu@${{ secrets.PRODUCTION_HOST }}:/opt/rmc-platform/apps/backend/dist/config/

      - name: Run seeds on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ubuntu
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            echo "==> Running DB seeds (idempotent — skips existing records, never replaces users)..."
            cd /opt/rmc-platform
            node apps/backend/dist/database/seeds/run-seeds.js
            echo "==> Seeds complete"
