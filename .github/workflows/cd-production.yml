name: CD — Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ec2-user
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/rmc-platform
            git fetch --tags
            git checkout ${{ github.ref_name }}
            docker compose -f docker-compose.prod.yml pull
            # Rolling deploy — restart one at a time
            docker compose -f docker-compose.prod.yml up -d --no-deps backend
            sleep 10
            curl -f http://localhost:3000/api/v1/health || exit 1
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend
            echo "Production deployment successful: ${{ github.ref_name }}"

  notify:
    name: Notify Deployment Result
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy-production.result == 'success'
        uses: slackapi/slack-github-action@v1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":white_check_mark: Production deploy SUCCEEDED — ${{ github.ref_name }} by ${{ github.actor }}"
            }

      - name: Notify failure
        if: needs.deploy-production.result == 'failure'
        uses: slackapi/slack-github-action@v1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: Production deploy FAILED — ${{ github.ref_name }} by ${{ github.actor }} — check GitHub Actions immediately"
            }
